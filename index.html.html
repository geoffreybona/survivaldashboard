<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ SurvivalStock — Dashboard Famille</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
/* ── RESET ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS ────────────────────────────────────────────── */
:root{
  --bg:#F2F2F7;--bg2:#fff;--bg3:#E5E5EA;--bg4:#D1D1D6;
  --text:#1C1C1E;--text2:#3C3C43;--text3:#8E8E93;--sep:#C6C6C8;
  --accent:#007AFF;--red:#FF3B30;--green:#34C759;
  --orange:#FF9500;--yellow:#FFCC00;--purple:#AF52DE;--teal:#5AC8FA;
  --r:14px;--sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --nav:66px;--side:220px;--hdr:56px;
}
.dark{
  --bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--bg4:#3A3A3C;
  --text:#fff;--text2:#EBEBF5;--text3:#8E8E93;--sep:#38383A;
  --sh:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
}

/* ── BASE ──────────────────────────────────────────────── */
html,body{height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s}

/* ── SHELL ─────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── HEADER ────────────────────────────────────────────── */
.hdr{
  height:var(--hdr);flex-shrink:0;
  background:var(--bg2);border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:80;gap:12px;
}
.hdr-left{display:flex;align-items:center;gap:10px;min-width:0}
.hdr-logo{font-size:22px;flex-shrink:0}
.hdr-title{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap}
.hdr-sub{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tgl-lbl{font-size:13px}
.tgl{width:44px;height:26px;background:var(--green);border-radius:13px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.tgl.off{background:var(--text3)}
.tgl-knob{width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .3s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tgl.on .tgl-knob{transform:translateX(18px)}

/* ── APP BODY ──────────────────────────────────────────── */
.app-body{flex:1;display:flex;overflow:hidden}

/* ── SIDEBAR (≥1024px) ─────────────────────────────────── */
.sidebar{
  display:none;width:var(--side);flex-shrink:0;
  background:var(--bg2);border-right:.5px solid var(--sep);
  flex-direction:column;padding:16px 10px;gap:2px;overflow-y:auto;
}
.sb-section{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.6px;padding:14px 12px 6px}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;cursor:pointer;border:none;background:none;
  color:var(--text3);font-size:14px;font-weight:600;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.sb-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sb-item:hover{background:var(--bg3)}
.sb-item.active{background:rgba(0,122,255,.12);color:var(--accent)}
.sb-divider{height:.5px;background:var(--sep);margin:8px 12px}

/* ── MAIN SCROLL ───────────────────────────────────────── */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav) + 8px)}

/* ── BOTTOM NAV (mobile/tablet) ────────────────────────── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav);
  background:var(--bg2);border-top:.5px solid var(--sep);
  display:flex;align-items:stretch;z-index:90;
  padding-bottom:env(safe-area-inset-bottom,0);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;border:none;
  background:none;color:var(--text3);transition:color .2s;padding:6px 0;
}
.ni.active{color:var(--accent)}
.ni svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ni-lbl{font-size:10px;font-weight:600;letter-spacing:.1px}

/* ── FAB ───────────────────────────────────────────────── */
.fab{
  position:fixed;bottom:calc(var(--nav) + 14px);right:18px;
  width:52px;height:52px;background:var(--accent);border-radius:50%;
  border:none;color:#fff;font-size:28px;line-height:1;display:flex;
  align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 18px rgba(0,122,255,.45);z-index:85;transition:transform .2s,box-shadow .2s;
}
.fab:hover{transform:scale(1.07);box-shadow:0 6px 22px rgba(0,122,255,.5)}

/* ── PAGE WRAPPER ──────────────────────────────────────── */
.page{padding:16px;max-width:100%}

/* ── TYPOGRAPHY ────────────────────────────────────────── */
.page-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.count-lbl{font-size:13px;color:var(--text3);margin-bottom:10px}

/* ── CARDS ─────────────────────────────────────────────── */
.card{background:var(--bg2);border-radius:var(--r);padding:16px;
  margin-bottom:12px;box-shadow:var(--sh)}

/* ── ALERT ─────────────────────────────────────────────── */
.alert-banner{
  background:var(--red);border-radius:var(--r);padding:14px 16px;
  margin-bottom:12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;cursor:pointer;
  box-shadow:0 4px 14px rgba(255,59,48,.3);
}
.alert-ok{
  background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.3);
  border-radius:var(--r);padding:12px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.alert-text h3{color:#fff;font-size:14px;font-weight:700}
.alert-text p{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
.alert-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

/* ── GAUGES ────────────────────────────────────────────── */
.gauge-block{margin-bottom:12px}
.gauge-block:last-child{margin-bottom:0}
.gauge-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.gauge-name{font-size:14px;font-weight:600;color:var(--text)}
.gauge-val{font-size:15px;font-weight:700;color:var(--text)}
.gauge-track{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden}
.gauge-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.gauge-foot{display:flex;justify-content:space-between;margin-top:4px}
.gauge-sub{font-size:11px;color:var(--text3)}

/* ── STATUS CARDS ──────────────────────────────────────── */
.sc{background:var(--bg2);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.sc-icon{font-size:26px;margin-bottom:8px}
.sc-label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sc-val{margin-top:8px}
.status-full{
  background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;
}

/* ── BADGES ────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px}
.ok{background:rgba(52,199,89,.15);color:var(--green)}
.warn{background:rgba(255,149,0,.15);color:var(--orange)}
.bad{background:rgba(255,59,48,.12);color:var(--red)}

/* ── CHARTS ────────────────────────────────────────────── */
.chart-card{background:var(--bg2);border-radius:var(--r);padding:16px;
  margin-bottom:12px;box-shadow:var(--sh)}
.chart-wrap{position:relative;width:100%}
.chart-bar-h{height:190px}
.chart-pie-h{height:180px}

/* ── SUMMARY CARD ──────────────────────────────────────── */
.summary-card{background:linear-gradient(135deg,#0057B8,#5856D6);
  border-radius:var(--r);padding:18px;margin-bottom:12px}
.summary-card h3{color:rgba(255,255,255,.75);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sum-item .sv{color:#fff;font-size:18px;font-weight:800}
.sum-item .sl{color:rgba(255,255,255,.65);font-size:10px;margin-top:2px}

/* ── FILTERS ───────────────────────────────────────────── */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:none;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;background:var(--bg3);color:var(--text3);
  transition:all .2s;flex-shrink:0}
.chip.active{background:var(--accent);color:#fff}

/* ── STOCK LIST ────────────────────────────────────────── */
.stock-list{background:var(--bg2);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.si{padding:12px 14px;border-bottom:.5px solid var(--sep);display:flex;
  align-items:flex-start;gap:10px}
.si:last-child{border-bottom:none}
.si-icon{width:38px;height:38px;border-radius:10px;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si-body{flex:1;min-width:0}
.si-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;
  word-break:break-word}
.si-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.si-tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;
  background:var(--bg3);color:var(--text3)}
.si-actions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.btn-xs{border:none;border-radius:8px;padding:5px 10px;font-size:12px;
  font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.btn-xs:hover{opacity:.8}
.btn-e{background:rgba(0,122,255,.12);color:var(--accent)}
.btn-d{background:rgba(255,59,48,.1);color:var(--red)}
.btn-b{background:rgba(52,199,89,.12);color:var(--green)}
.si-right{text-align:right;flex-shrink:0;min-width:68px}
.si-qty{font-size:15px;font-weight:700;color:var(--text)}
.si-unit{font-size:11px;color:var(--text3)}
.si-exp{font-size:11px;margin-top:4px;font-weight:600}
.si-exp.ok{color:var(--text3)}
.si-exp.warn{color:var(--orange)}
.si-exp.expired{color:var(--red)}

/* ── COURSES ───────────────────────────────────────────── */
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:.5px solid var(--sep)}
.ci:last-child{border-bottom:none}
.cbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;font-size:13px}
.cbox.done{background:var(--green);border-color:var(--green);color:#fff}
.ci-name{flex:1;font-size:14px;color:var(--text);transition:all .2s;word-break:break-word}
.ci-name.done{text-decoration:line-through;color:var(--text3)}
.ci-qty{font-size:13px;font-weight:600;color:var(--text3);white-space:nowrap}

/* ── MATERIAL ──────────────────────────────────────────── */
.mat-list{background:var(--bg2);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--sh);margin-bottom:12px}
.mat-hdr{display:grid;grid-template-columns:1fr 52px 52px;gap:6px;
  padding:10px 14px;background:var(--bg3);border-bottom:.5px solid var(--sep)}
.mat-hdr span{font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.3px}
.mat-item{display:grid;grid-template-columns:1fr 52px 52px;gap:6px;
  align-items:center;padding:11px 14px;border-bottom:.5px solid var(--sep)}
.mat-item:last-child{border-bottom:none}
.mat-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;
  word-break:break-word}
.mat-loc{font-size:11px;color:var(--text3);margin-top:2px}
.mat-btns{display:flex;gap:4px;margin-top:6px}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--sep);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;margin:0 auto;transition:all .2s}
.chk.owned{background:var(--green);border-color:var(--green);color:#fff}
.chk.depart{background:var(--orange);border-color:var(--orange);color:#fff}

/* ── SETTINGS ──────────────────────────────────────────── */
.range-big{font-size:36px;font-weight:800;color:var(--accent);
  text-align:center;margin:4px 0}
.range-desc{font-size:12px;color:var(--text3);text-align:center;margin-bottom:12px}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.range-limits{display:flex;justify-content:space-between;margin-top:4px;
  font-size:11px;color:var(--text3)}
.person-card{background:var(--bg3);border-radius:12px;padding:12px 14px;
  margin-bottom:8px;display:flex;align-items:center;gap:12px}
.person-avatar{width:40px;height:40px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:18px;
  background:var(--accent);flex-shrink:0}
.person-info{flex:1;min-width:0}
.person-name{font-size:14px;font-weight:700;color:var(--text)}
.person-detail{font-size:12px;color:var(--text3);margin-top:1px}
.person-actions{display:flex;gap:6px;flex-shrink:0}
.btn-add-p{width:100%;border:2px dashed var(--sep);background:transparent;
  border-radius:12px;padding:12px;color:var(--accent);font-size:14px;
  font-weight:700;cursor:pointer;margin-top:4px;transition:border-color .2s}
.btn-add-p:hover{border-color:var(--accent)}

/* ── MODALS ────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;
  max-height:90vh;overflow-y:auto;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0))}
.modal-handle{width:40px;height:4px;background:var(--sep);border-radius:2px;
  margin:0 auto 20px}
.modal h2{font-size:20px;font-weight:800;color:var(--text);margin-bottom:18px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fi{width:100%;background:var(--bg3);border:none;border-radius:12px;
  padding:12px 14px;font-size:15px;color:var(--text);outline:none;
  transition:background .2s;-webkit-appearance:none;appearance:none}
.fi:focus{background:var(--bg4)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-p{width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:14px;padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn-p:hover{opacity:.88}
.btn-s{width:100%;background:var(--bg3);color:var(--text);border:none;
  border-radius:14px;padding:14px;font-size:15px;font-weight:600;
  cursor:pointer;margin-top:8px}

/* ── TOAST ─────────────────────────────────────────────── */
.toast{position:fixed;bottom:calc(var(--nav) + 12px);left:50%;
  transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;
  z-index:500;pointer-events:none;opacity:0;transition:opacity .3s;
  white-space:nowrap}
.toast.show{opacity:1}

/* ── EMPTY ─────────────────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:16px;font-weight:600}

/* ════════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════════ */

/* ── MOBILE default (< 480px) ─── already covered above ─ */

/* ── PHABLET 480px+ ────────────────────────────────────── */
@media(min-width:480px){
  .sum-grid{grid-template-columns:repeat(4,1fr)}
  .hdr{padding:0 20px}
  .page{padding:16px 20px}
}

/* ── TABLET 640px+ ─────────────────────────────────────── */
@media(min-width:640px){
  :root{--nav:70px}
  .page{padding:20px 24px}
  .modal{border-radius:20px;margin:auto;max-width:560px;
    border-radius:20px;padding:28px 28px 28px}
  .overlay{align-items:center}
  .modal-handle{display:none}
  .fab{right:28px;bottom:calc(var(--nav) + 20px)}
  /* 2-col dashboard on tablet */
  .dash-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dash-full{grid-column:1/-1}
  /* stock list wider padding */
  .si{padding:14px 18px}
  .mat-hdr,.mat-item{padding:12px 18px}
  /* bigger range display */
  .range-big{font-size:40px}
}

/* ── DESKTOP 1024px+ ───────────────────────────────────── */
@media(min-width:1024px){
  /* swap bottom nav for sidebar */
  .sidebar{display:flex}
  .bnav{display:none}
  .main{padding-bottom:20px}
  .toast{bottom:28px}
  .fab{right:36px;bottom:36px}
  :root{--r:16px}
  .page{padding:28px 36px;max-width:1200px}
  /* 3-col status on desktop */
  .status-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  /* chart taller on desktop */
  .chart-bar-h{height:240px}
  .chart-pie-h{height:210px}
  /* modal centered */
  .modal{max-width:580px}
  .sum-grid{grid-template-columns:repeat(4,1fr)}
}

/* ── WIDE 1280px+ ──────────────────────────────────────── */
@media(min-width:1280px){
  :root{--side:240px}
  .page{padding:32px 44px}
  .dash-wrap{gap:20px}
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-left">
      <span class="hdr-logo">🛡️</span>
      <div>
        <div class="hdr-title">SurvivalStock</div>
        <div class="hdr-sub" id="hdr-sub">Famille · 4 personnes</div>
      </div>
    </div>
    <div class="toggle-wrap">
      <span class="tgl-lbl">☀️</span>
      <div class="tgl on" id="tgl" onclick="toggleTheme()"><div class="tgl-knob"></div></div>
      <span class="tgl-lbl">🌙</span>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">

    <!-- SIDEBAR desktop -->
    <nav class="sidebar" id="sidebar">
      <div class="sb-section">Navigation</div>
      <button class="sb-item active" id="sb-0" onclick="goTab(0)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard
      </button>
      <button class="sb-item" id="sb-1" onclick="goTab(1)">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>Stocks
      </button>
      <button class="sb-item" id="sb-2" onclick="goTab(2)">
        <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Courses
      </button>
      <button class="sb-item" id="sb-3" onclick="goTab(3)">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Matériel
      </button>
      <button class="sb-item" id="sb-4" onclick="goTab(4)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Paramètres

const LS='survivalstock_v1';
function loadData(){
  try{
    const raw=localStorage.getItem(LS);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(d.locations)locations=d.locations;
    if(d.params)params=d.params;
    if(d.stocks)stocks=d.stocks;
    if(d.courses)courses=d.courses;
    if(d.mats)mats=d.mats;
    return true;
  }catch(e){console.warn('loadData error',e);return false;}
}
function saveData(){
  try{

  }catch(e){console.warn('saveData error',e);}
}

// ── INTÉGRATION HOME ASSISTANT (optionnel) ────────────────────
// Renseigner l'URL et le token dans l'onglet Paramètres > HA Sync
function getHAConfig(){
  try{return JSON.parse(localStorage.getItem('ss_ha_cfg')||'{}');}catch(e){return{};}
}
function saveHAConfig(url,token,webhook){
  localStorage.setItem('ss_ha_cfg',JSON.stringify({url,token,webhook}));
}
function calcKPIs(){
  const foods=stocks.filter(s=>s.cat!=='💧 Eau');
  const totalKcal=foods.reduce((a,s)=>a+(s.kcal||0)*s.qty,0);
  const foodDays=params.dailyKcal>0?Math.round(totalKcal/params.dailyKcal):0;
  const waterL=stocks.filter(s=>s.cat==='💧 Eau').reduce((a,s)=>a+s.qty,0);
  const waterDays=params.dailyWater>0?Math.round(waterL/params.dailyWater):0;
  const target=params.targetMonths*30;
  const alerts=stocks.filter(s=>{
    if(!s.exp)return false;
    const d=new Date(s.exp),now=new Date(),soon=new Date();
    soon.setMonth(soon.getMonth()+1);
    return d<soon;
  }).length;
  const totalProt=foods.reduce((a,s)=>a+(s.prot||0)*s.qty,0);
  const totalGluc=foods.reduce((a,s)=>a+(s.gluc||0)*s.qty,0);
  const totalLip=foods.reduce((a,s)=>a+(s.lip||0)*s.qty,0);
  const matOwned=mats.filter(m=>m.owned).length;
  return{foodDays,waterDays,target,alerts,totalKcal:Math.round(totalKcal),
    waterL:Math.round(waterL),totalProt:Math.round(totalProt),
    totalGluc:Math.round(totalGluc),totalLip:Math.round(totalLip),
    matOwned,matTotal:mats.length,
    foodPct:target>0?Math.min(100,Math.round(foodDays/target*100)):0,
    waterPct:target>0?Math.min(100,Math.round(waterDays/target*100)):0};
}
async function pushToHA(){
  const cfg=getHAConfig();
  if(!cfg.webhook&&!cfg.url)return; // pas configuré, on skip silencieusement
  const kpis=calcKPIs();
  try{
    if(cfg.webhook){
      // Mode Webhook (plus simple, ne nécessite pas de token)
      await fetch(cfg.webhook,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(kpis)
      });
    } else if(cfg.url&&cfg.token){
      // Mode API REST HA (nécessite Long-Lived Access Token)
      const base=cfg.url.replace(/\/$/,'');
      const calls=[
        ['input_number.survival_food_days',kpis.foodDays],
        ['input_number.survival_water_days',kpis.waterDays],
        ['input_number.survival_alerts',kpis.alerts],
        ['input_number.survival_food_pct',kpis.foodPct],
        ['input_number.survival_water_pct',kpis.waterPct],
        ['input_number.survival_total_kcal',kpis.totalKcal],
        ['input_number.survival_water_liters',kpis.waterL],
      ];
      await Promise.all(calls.map(([entity,value])=>
        fetch(`${base}/api/services/input_number/set_value`,{
          method:'POST',
          headers:{'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},
          body:JSON.stringify({entity_id:entity,value})
        })
      ));
    }
  }catch(e){/* silencieux, HA peut être hors réseau */}
}

}

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='survivalstock_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
  toast('Sauvegarde exportée ✓');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.stocks&&d.mats&&d.params){
        if(!confirm('Remplacer toutes vos données par ce fichier ?'))return;
        if(d.locations)locations=d.locations;
        params=d.params;stocks=d.stocks;courses=d.courses||[];mats=d.mats;
        saveData();render();toast('Import réussi ✓');
      }else{toast('Fichier invalide');}
    }catch(err){toast('Erreur de lecture du fichier');}
  };
  reader.readAsText(file);
  e.target.value='';
}

  document.getElementById('app').className=isDark?'dark':'';
  const t=document.getElementById('tgl');
  isDark?t.classList.replace('on','off'):t.classList.replace('off','on');
  render();
}

// ── NAV ──────────────────────────────────────────────────────
function goTab(i){
  tab=i;destroyCharts();
  document.querySelectorAll('.ni').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  for(let j=0;j<5;j++){const s=document.getElementById('sb-'+j);if(s)s.classList.toggle('active',j===i);}
  render();
}

// ── RENDER ───────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');
  m.innerHTML='';
  document.getElementById('fab-slot').innerHTML='';
  if(tab===0) renderDash(m);
  else if(tab===1) renderStocks(m);
  else if(tab===2) renderCourses(m);
  else if(tab===3) renderMat(m);
  else renderSettings(m);
  document.getElementById('hdr-sub').textContent=
    'Famille · '+params.persons.length+' personne'+(params.persons.length>1?'s':'');
}

// ── HELPERS ──────────────────────────────────────────────────
function expSt(exp){
  if(!exp)return'ok';
  const d=new Date(exp),now=new Date(),soon=new Date();
  soon.setMonth(soon.getMonth()+1);
  return d<now?'expired':d<soon?'warn':'ok';
}
function fmt(d){return d?new Date(d).toLocaleDateString('fr-FR'):'—';}
function calcFood(){
  const k=stocks.filter(s=>s.cat!=='💧 Eau').reduce((a,s)=>a+(s.kcal||300)*s.qty,0);
  return{days:Math.round(k/params.dailyKcal),kcal:Math.round(k)};
}
function calcWater(){
  const l=stocks.filter(s=>s.cat==='💧 Eau').reduce((a,s)=>a+s.qty,0);
  return{days:Math.round(l/params.dailyWater),liters:Math.round(l)};
}
function getAlerts(){return stocks.filter(s=>expSt(s.exp)!=='ok');}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}

function gauge(name,days,target,color,sub){
  const pct=Math.min(100,Math.round(days/target*100));
  const c=pct>60?color:pct>30?'#FF9500':'#FF3B30';
  return`<div class="gauge-block">
    <div class="gauge-hd"><span class="gauge-name">${name}</span><span class="gauge-val">${days} j</span></div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%;background:${c}"></div></div>
    <div class="gauge-foot"><span class="gauge-sub">${sub}</span><span class="gauge-sub">Cible : ${target} j</span></div>
  </div>`;
}
function miniGauge(name,pct,color){
  const c=pct>60?color:pct>30?'#FF9500':'#FF3B30';
  return`<div class="gauge-block">
    <div class="gauge-hd"><span class="gauge-name" style="font-size:13px">${name}</span><span class="gauge-val" style="font-size:13px">${pct}%</span></div>
    <div class="gauge-track" style="height:9px"><div class="gauge-fill" style="width:${pct}%;background:${c}"></div></div>
  </div>`;
}

                ${s.prot?`<span class="si-tag">P ${s.prot}g</span>`:''}

    exp:document.getElementById('ms-exp').value,

    prot:parseFloat(document.getElementById('ms-prot').value)||0,
    gluc:parseFloat(document.getElementById('ms-gluc').value)||0,
    lip:parseFloat(document.getElementById('ms-lip').value)||0
  };

  idx>=0?courses[idx].qty+=qty:courses.push({name,qty,unit,done:false});

// ── LOCALISATIONS (CRUD) ────────────────────────────────────────
function openLocManager(){
  renderLocList();
  openModal('modal-loc');
}
function renderLocList(){
  const wrap=document.getElementById('loc-list');
  wrap.innerHTML=locations.map((l,i)=>{
    const count=mats.filter(m=>m.loc===l).length;
    return`<div class="ci" style="padding:9px 0">
      <span class="ci-name" style="flex:1">📍 ${l}</span>
      <span class="ci-qty" style="font-weight:500;color:var(--text3)">${count} art.</span>
      <button class="btn-xs btn-e" onclick="renameLocation(${i})">✏️</button>
      <button class="btn-xs btn-d" onclick="deleteLocation(${i})">🗑️</button>
    </div>`;
  }).join('');
}
function addLocation(){
  const input=document.getElementById('loc-new-name');
  const name=input.value.trim();
  if(!name){toast('Saisissez un nom de localisation');return;}
  if(locations.includes(name)){toast('Cette localisation existe déjà');return;}
  locations.push(name);
  input.value='';
  saveData();
  renderLocList();
  toast('Localisation ajoutée ✓');
}
function renameLocation(i){
  const oldName=locations[i];
  const newName=prompt('Renommer la localisation :',oldName);
  if(!newName||!newName.trim()||newName.trim()===oldName)return;
  const trimmed=newName.trim();
  if(locations.includes(trimmed)){alert('Cette localisation existe déjà.');return;}
  locations[i]=trimmed;
  mats.forEach(m=>{if(m.loc===oldName)m.loc=trimmed;});
  if(matFilter===oldName)matFilter=trimmed;
  saveData();
  renderLocList();
  toast('Localisation renommée ✓');
}
function deleteLocation(i){
  const name=locations[i];
  const count=mats.filter(m=>m.loc===name).length;
  const msg=count>0
    ?`Supprimer "${name}" ? ${count} article(s) associé(s) seront déplacés vers "Non classé".`
    :`Supprimer "${name}" ?`;
  if(!confirm(msg))return;
  locations.splice(i,1);
  if(count>0){
    if(!locations.includes('Non classé'))locations.push('Non classé');
    mats.forEach(m=>{if(m.loc===name)m.loc='Non classé';});
  }
  if(matFilter===name)matFilter='Tout';
  renderLocList();
  toast('Localisation supprimée ✓');
}

  const sel=document.getElementById('ms-catalog');
  sel.innerHTML='<option value="">— Saisie libre —</option>'+
    FOOD_CATALOG.map((f,i)=>`<option value="${i}">${f.cat.split(' ')[0]} ${f.name}</option>`).join('');
}
function applyCatalog(){
  const idx=document.getElementById('ms-catalog').value;
  if(idx==='')return;
  const f=FOOD_CATALOG[+idx];
  const unit=document.getElementById('ms-unit').value||'kg';
  // Le catalogue donne des valeurs pour 100g/100mL — on convertit pour 1 unité (kg/L = x10, g/ml/unité/boîte = valeur telle quelle)
  const mult=(unit==='kg'||unit==='L')?10:1;
  document.getElementById('ms-name').value=f.name;
  document.getElementById('ms-cat').value=f.cat;
  document.getElementById('ms-kcal').value=Math.round(f.kcal*mult);
  document.getElementById('ms-prot').value=Math.round(f.prot*mult*10)/10;
  document.getElementById('ms-gluc').value=Math.round(f.gluc*mult*10)/10;
  document.getElementById('ms-lip').value=Math.round(f.lip*mult*10)/10;
}

// ── SETTINGS ─────────────────────────────────────────────────
function renderSettings(el){
  const raw=localStorage.getItem(LS);
  let savedAt='Jamais';
  try{if(raw){const d=JSON.parse(raw);if(d.savedAt)savedAt=new Date(d.savedAt).toLocaleString('fr-FR');}}catch(e){}
  const haCfg=getHAConfig();

  el.innerHTML=`<div class="page">
    <div class="page-title">⚙️ Paramètres</div>

    <div class="card" style="background:rgba(0,122,255,0.07);border:1px solid rgba(0,122,255,0.2);margin-bottom:12px">
      <div class="card-title" style="color:var(--accent)">🏠 Sync Home Assistant</div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:10px;line-height:1.6">
        Envoie automatiquement vos KPIs vers HA à chaque modification.<br>
        Choisissez <strong>Webhook</strong> (plus simple) ou <strong>API REST</strong>.
      </div>
      <div class="fg">
        <label class="fl">URL de Home Assistant</label>
        <input class="fi" id="ha-url" placeholder="http://homeassistant.local:8123" value="${haCfg.url||''}">
      </div>
      <div class="fg">
        <label class="fl">Long-Lived Access Token (API REST)</label>
        <input class="fi" id="ha-token" type="password" placeholder="eyJ0eXAiOi..." value="${haCfg.token||''}">
      </div>
      <div class="fg">
        <label class="fl">— OU — URL Webhook HA</label>
        <input class="fi" id="ha-webhook" placeholder="http://homeassistant.local:8123/api/webhook/survivalstock" value="${haCfg.webhook||''}">
      </div>
      <button class="btn-p" style="margin-top:4px;font-size:13px;padding:10px" onclick="testHAConnection()">🔄 Sauvegarder &amp; tester la sync</button>
      <div style="font-size:11px;color:var(--t3);margin-top:10px;line-height:1.6;background:var(--bg3);border-radius:8px;padding:8px">
        <strong>Mode Webhook</strong> (recommandé) :<br>
        HA → Paramètres → Automations → + → Déclencheur Webhook<br>
        ID webhook : <code>survivalstock</code><br>
        Puis coller l'URL générée dans le champ Webhook ci-dessus.<br><br>
        <strong>Mode API REST</strong> :<br>
        HA → Profil → Tokens → Créer un token<br>
        Les entités <code>input_number.survival_*</code> doivent exister dans HA.
      </div>
    </div>

    <div class="card" style="background:rgba(52,199,89,0.08);border:1px solid rgba(52,199,89,0.25);margin-bottom:12px">
      <div class="card-title">💾 Sauvegarde locale</div>
      <div style="font-size:13px;color:var(--t3);margin-bottom:10px">Dernière sauvegarde : <strong style="color:var(--green)">${savedAt}</strong></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn-p" style="margin-top:0;font-size:13px;padding:10px" onclick="exportData()">📤 Exporter JSON</button>
        <label class="btn-p" style="margin-top:0;font-size:13px;padding:10px;text-align:center;cursor:pointer">
          📥 Importer JSON<input type="file" accept=".json" style="display:none" onchange="importData(event)">
        </label>
      </div>
      <button onclick="resetData()" style="width:100%;margin-top:8px;background:rgba(255,59,48,0.1);color:var(--red);border:none;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">🔄 Remettre les données par défaut</button>
    </div>

    <div class="card">
      <div class="card-title">Objectif d'autonomie</div>
      <div class="range-big" id="sv-m">${params.targetMonths} mois</div>
      <div class="range-desc">Durée cible de stockage autonome</div>
      <input type="range" min="1" max="24" step="1" value="${params.targetMonths}"
        oninput="params.targetMonths=+this.value;document.getElementById('sv-m').textContent=this.value+' mois';saveData()">
      <div class="range-limits"><span>1 mois</span><span>24 mois</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="card" style="margin-bottom:0">
        <div class="card-title">Calories / jour</div>
        <div class="range-big" style="font-size:24px" id="sv-k">${params.dailyKcal.toLocaleString('fr-FR')}</div>
        <div class="range-desc">kcal famille</div>
        <input type="range" min="4000" max="15000" step="100" value="${params.dailyKcal}"
          oninput="params.dailyKcal=+this.value;document.getElementById('sv-k').textContent=(+this.value).toLocaleString('fr-FR');saveData()">
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-title">Eau / jour</div>
        <div class="range-big" style="font-size:24px" id="sv-w">${params.dailyWater}</div>
        <div class="range-desc">litres famille</div>
        <input type="range" min="4" max="30" step="0.5" value="${params.dailyWater}"
          oninput="params.dailyWater=+this.value;document.getElementById('sv-w').textContent=(+this.value).toFixed(1);saveData()">
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:14px">Membres de la famille</div>
      ${params.persons.map((p,i)=>`<div class="person-card">
        <div class="person-avatar">${p.sex==='H'?'👨':p.sex==='F'?'👩':'👧'}</div>
        <div class="person-info">
          <div class="person-name">${p.name}</div>
          <div class="person-detail">${p.sex==='H'?'Homme':p.sex==='F'?'Femme':'Enfant'} · ${p.age} ans</div>
        </div>
        <div class="person-actions">
          <button class="btn-xs btn-e" onclick="openEditPerson(${i})">✏️</button>
          <button class="btn-xs btn-d" onclick="delPerson(${i})">🗑️</button>
        </div>
      </div>`).join('')}
      <button class="btn-add-p" onclick="openAddPerson()">+ Ajouter un membre</button>
    </div>
  </div>`;
}

function openAddPerson(){
  editPersonIdx=-1;
  document.getElementById('mp-title').textContent='Ajouter un membre';
  document.getElementById('mp-name').value='';
  document.getElementById('mp-age').value='';
  openModal('modal-person');
}
function openEditPerson(i){
  editPersonIdx=i;const p=params.persons[i];
  document.getElementById('mp-title').textContent='Modifier — '+p.name;
  document.getElementById('mp-name').value=p.name;
  document.getElementById('mp-age').value=p.age;
  document.getElementById('mp-sex').value=p.sex;
  openModal('modal-person');
}
function savePerson(){
  const p={
    name:document.getElementById('mp-name').value||'Membre',
    age:parseInt(document.getElementById('mp-age').value)||25,
    sex:document.getElementById('mp-sex').value
  };
  editPersonIdx>=0?params.persons[editPersonIdx]=p:params.persons.push(p);
  closeModal('modal-person');saveData();render();
}
function delPerson(i){
  if(params.persons.length<=1)return alert('Au moins 1 membre requis.');
  if(confirm('Supprimer "'+params.persons[i].name+'" ?')){params.persons.splice(i,1);render();}
}

// ── MODALS ───────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});

// ── TOAST ────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
